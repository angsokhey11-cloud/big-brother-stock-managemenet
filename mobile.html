(async function(){
'use strict';

const MOBILE_STYLE = String.raw`

const MOBILE_PATCH = String.raw`
(function(){
'use strict';
const $=id=>document.getElementById(id);
const categories=[
  {value:'PURCHASE',flow:'INFLOW',icon:'🛒',label:'Purchase'},
  {value:'RECEIVE_FROM_CLIENT',flow:'INFLOW',icon:'📦',label:'Receive from Client'},
  {value:'BACK_SALE',flow:'INFLOW',icon:'↩',label:'Back Sale'},
  {value:'BATCH_STOCK',flow:'OUTFLOW',icon:'🚚',label:'Batch Stock'},
  {value:'STOCK_DAMAGE',flow:'OUTFLOW',icon:'⚠️',label:'Stock Damage'},
  {value:'STAFF_ALLOWANCE',flow:'OUTFLOW',icon:'👤',label:'Staff Allowance'},
  {value:'DAMAGE_CLEAR',flow:'OUTFLOW',icon:'🗑️',label:'Damaged Stock Cleared'},
  {value:'DAMAGE_EXCHANGE_RECEIVE',flow:'INFLOW',icon:'🔄',label:'Damaged Stock Exchange Received'}
];
const titles={
  PURCHASE:['🛒 Purchase Receiving','📦 Products Receiving'],
  RECEIVE_FROM_CLIENT:['📦 Receive from Client','📦 Products Receiving'],
  BACK_SALE:['↩ Back Sale','📦 Batch Return Products'],
  BATCH_STOCK:['🚚 Batch Stock to Salesman','📦 Batch Products'],
  STOCK_DAMAGE:['⚠️ Stock Damage','📦 Damage Products'],
  STAFF_ALLOWANCE:['👤 Staff Allowance','📦 Allowance Products'],
  DAMAGE_CLEAR:['🗑️ Damaged Stock Cleared','📦 Damaged Products'],
  DAMAGE_EXCHANGE_RECEIVE:['🔄 Damage Exchange Received','📦 Exchange Receiving Items']
};
function clean(v){return String(v==null?'':v).trim()}
function currentType(){try{return clean(movementType)||'PURCHASE'}catch(_){return 'PURCHASE'}}
function cards(){return [...document.querySelectorAll('.page > .card:not(.bb-category-card)')]}
function installBase(){
  document.body.classList.add('bb-stock-mobile');
  const h=document.querySelector('.topbar h1');if(h)h.textContent='Stock Key-In';
  const sub=document.querySelector('.topbar .subtitle');if(sub)sub.textContent='Physical stock movement · Purchased + Zero-Cost Batch control';
  const refresh=$('refreshBtn');if(refresh){refresh.title='Refresh Stock';refresh.setAttribute('aria-label','Refresh Stock')}
  const c=cards();
  if(c[0]){c[0].classList.add('bb-transaction-card');const t=c[0].querySelector('.section-title');if(t)t.textContent='Transaction Information'}
  if(c[1])c[1].classList.add('bb-work-card');
  if(c[2])c[2].classList.add('bb-products-card');
  if(c[3])c[3].classList.add('bb-preview-card');
}
function installWorkspace(){
  const c=cards(),transaction=c[0],work=c[1];
  if(!transaction||!work)return;
  const flowToggle=$('flowInBtn')?.closest('.flow-toggle');
  const sourceField=$('movementCategorySelect')?.closest('.field');
  const sourceGrid=sourceField?.closest('.grid');
  if(sourceGrid)sourceGrid.classList.add('bb-mobile-category-source');
  [...transaction.children].filter(el=>el.tagName==='DIV'&&/height/i.test(el.getAttribute('style')||'')).forEach(el=>el.style.display='none');
  let flowShell=$('bbMobileFlowShell');
  if(!flowShell){
    flowShell=document.createElement('div');
    flowShell.id='bbMobileFlowShell';
    flowShell.className='bb-flow-shell';
    transaction.insertAdjacentElement('afterend',flowShell);
  }
  if(flowToggle&&flowToggle.parentNode!==flowShell)flowShell.appendChild(flowToggle);
  let categoryCard=$('bbMobileCategoryCard');
  if(!categoryCard){
    categoryCard=document.createElement('section');
    categoryCard.id='bbMobileCategoryCard';
    categoryCard.className='card bb-category-card';
    categoryCard.innerHTML='<div class="bb-category-head"><strong>Movement Category</strong><span>Choose how stock is moving</span></div><div id="bbMobileCategories" class="bb-mobile-categories"></div>';
    flowShell.insertAdjacentElement('afterend',categoryCard);
  }
  const exchange=$('damageExchangeReceiveFields');
  if(exchange&&exchange.closest('.bb-work-card')!==work){
    const note=work.querySelector('.bb-mobile-note-collapsed')||work.querySelector('#note')?.closest('.field');
    work.insertBefore(exchange,note||null);
  }
}
function activateCategory(meta){
  if(!meta)return;
  let activeFlow='';try{activeFlow=clean(flow)}catch(_){}
  if(activeFlow!==meta.flow&&typeof setFlow==='function')setFlow(meta.flow);
  setTimeout(()=>{
    const select=$('movementCategorySelect');
    if(select&&[...select.options].some(o=>o.value===meta.value))select.value=meta.value;
    if(typeof setMovementType==='function')setMovementType(meta.value);
    setTimeout(syncAll,0);
  },0);
}
function renderCategories(){
  const host=$('bbMobileCategories');if(!host)return;
  const active=currentType();
  host.innerHTML=categories.map(x=>'<button type="button" class="bb-mobile-category-btn'+(x.value===active?' active':'')+'" data-type="'+x.value+'"><span>'+x.icon+'</span>'+x.label+'</button>').join('');
  host.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>activateCategory(categories.find(x=>x.value===btn.dataset.type))));
}
function installPurchaseWork(){
  const fields=$('purchaseFields');if(!fields)return;
  const grid=fields.querySelector('.grid');if(!grid)return;
  const dateField=$('purchaseDateView')?.closest('.field');
  if(dateField)dateField.classList.add('bb-purchase-date-field');
  if(!$('bbPurchasePurchaser')){
    const invoiceField=$('purchaseInvoiceView')?.closest('.field');
    const f=document.createElement('div');
    f.className='field bb-mobile-purchaser-field';
    f.innerHTML='<label>Purchaser</label><input id="bbPurchasePurchaser" readonly placeholder="Auto from Purchase">';
    grid.insertBefore(f,invoiceField||null);
  }
  if(!$('bbPurchaseCallout')){
    const info=document.createElement('div');
    info.id='bbPurchaseCallout';
    info.className='bb-purchase-callout';
    info.textContent='ⓘ Purchase Qty + Promotion Qty are included in receiving.';
    fields.appendChild(info);
  }
  const select=$('purchaseSelect');
  if(select&&!select.dataset.bbMobileMeta){
    select.dataset.bbMobileMeta='1';
    select.addEventListener('change',()=>{[50,250,700,1500].forEach(ms=>setTimeout(updatePurchaseMeta,ms))});
  }
}
function updatePurchaseMeta(){
  const out=$('bbPurchasePurchaser');if(!out)return;
  let name='';
  try{
    if(typeof purchaseDetail!=='undefined')name=clean(purchaseDetail?.purchase?.purchaserName);
    if(!name&&typeof selectedPurchaseSummary==='function')name=clean(selectedPurchaseSummary()?.purchaserName);
  }catch(_){}
  out.value=name||'Auto from Purchase';
}
function decoratePurchaseRows(){
  const body=$('purchaseReceiveRows');if(!body)return;
  [...body.querySelectorAll('tr')].forEach(tr=>{
    const cells=tr.querySelectorAll('td');if(cells.length<8)return;
    const code=clean(cells[1].textContent);
    if(code&&!cells[0].querySelector('.bb-mobile-product-code')){
      const d=document.createElement('div');d.className='bb-mobile-product-code';d.textContent=code;cells[0].appendChild(d);
    }
  });
}
function installPurchaseRowObserver(){
  const body=$('purchaseReceiveRows');if(!body||body.dataset.bbMobileObserver)return;
  body.dataset.bbMobileObserver='1';
  decoratePurchaseRows();
  new MutationObserver(decoratePurchaseRows).observe(body,{childList:true,subtree:true});
}
function installNoteCollapse(){
  const note=$('note');if(!note)return;
  const field=note.closest('.field');if(!field||field.closest('.bb-mobile-note-collapsed'))return;
  const box=document.createElement('div');box.className='bb-mobile-note-collapsed';
  const toggle=document.createElement('button');toggle.type='button';toggle.className='bb-mobile-note-toggle';toggle.textContent='▸ Note (Optional)';
  const body=document.createElement('div');body.className='bb-mobile-note-body';
  field.parentNode.insertBefore(box,field);body.appendChild(field);box.append(toggle,body);
  toggle.addEventListener('click',()=>{box.classList.toggle('open');toggle.textContent=(box.classList.contains('open')?'▾':'▸')+' Note (Optional)'});
}
function syncTitles(){
  const c=cards(),work=c[1],products=c[2],type=currentType(),pair=titles[type]||['Movement Details','Products'];
  const wt=work?.querySelector('.section-title');if(wt)wt.textContent=pair[0];
  const pt=products?.querySelector('.section-title');if(pt)pt.textContent=pair[1];
}
function keepActionsLast(){
  const actions=document.querySelector('.actions');if(actions&&actions.parentNode!==document.body)document.body.appendChild(actions);
}
function syncAll(){
  installWorkspace();
  renderCategories();
  syncTitles();
  updatePurchaseMeta();
  decoratePurchaseRows();
}
function hookMovementType(){
  if(typeof setMovementType!=='function'||setMovementType.__bbMobileHook)return;
  const base=setMovementType;
  const wrapped=function(){const r=base.apply(this,arguments);setTimeout(syncAll,0);return r};
  wrapped.__bbMobileHook=true;
  setMovementType=wrapped;
}
function init(){
  installBase();
  installNoteCollapse();
  installWorkspace();
  installPurchaseWork();
  installPurchaseRowObserver();
  keepActionsLast();
  hookMovementType();
  ['flowInBtn','flowOutBtn','damageWarehouseBtn','damageBatchBtn'].forEach(id=>$(id)?.addEventListener('click',()=>setTimeout(syncAll,20)));
  syncAll();
  [100,400,1000,1800].forEach(ms=>setTimeout(syncAll,ms));
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
`;

try{
  const response=await fetch('legacy-google-v3.html?v=20260912-zero-cost-1',{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load Stock Key-In source.');
  let html=await response.text();

  const headClose=html.toLowerCase().indexOf('</head>');
  if(headClose<0)throw new Error('Stock source is missing </head>.');
  const headInjection='\n<script src="supabase-stock-adapter.js?v=20260912-zero-cost-1"><\/script>\n<style id="bb-stock-mobile-style">'+MOBILE_STYLE+'<\/style>\n';
  html=html.slice(0,headClose)+headInjection+html.slice(headClose);

  const marker='$("addProductBtn").onclick=addProduct;$("clearBtn").onclick=clearForm;$("refreshBtn").onclick=()=>refreshStockOnly(false);$("saveBtn").onclick=saveMovement;';
  const cutover='// SUPABASE STOCK CUTOVER MOBILE V2\njsonp=window.BBStockAdapter.jsonp;\napiPost=window.BBStockAdapter.apiPost;\ntry{window.BBStockAdapter.clearLegacyCaches();}catch(_){}\nreadCache=()=>null;\nwriteCache=()=>{};\napplyCache=()=>false;\napplySharedReportStockCache=()=>false;\n'+marker;
  if(!html.includes(marker))throw new Error('Stock mobile cutover marker was not found.');
  html=html.replace(marker,cutover);

  html=html.replace('<title>BIG BROTHER — Stock In-Out V3.0 Fast Reference Bootstrap</title>','<title>BIG BROTHER — Stock Key-In Mobile</title>');
  html=html.replaceAll('Stock Database','Supabase Stock Database').replaceAll('Purchase Database','Supabase Purchase Database');

  const bodyClose=html.toLowerCase().lastIndexOf('</body>');
  if(bodyClose<0)throw new Error('Stock source is missing </body>.');
  const scripts='\n<script src="batch-v2-stock-guard.js?v=20260912-zero-cost-4"><\/script>\n<script src="back-sale-live-remaining.js?v=20260912-live-remaining-1"><\/script>\n<script src="damaged-clearance-keyin.js?v=20260911-3"><\/script>\n<script src="damaged-exchange-receive-keyin.js?v=20260910-3"><\/script>\n<script>'+MOBILE_PATCH+'<\/script>\n';
  html=html.slice(0,bodyClose)+scripts+html.slice(bodyClose);

  document.open();document.write(html);document.close();
}catch(error){
  console.error(error);
  document.body.innerHTML='<div class="bb-mobile-loader"><div class="bb-mobile-loader-card">Could not open Stock Key-In<span>'+String(error?.message||error)+'</span></div></div>';
}
})();
</script>
</body>
</html>
