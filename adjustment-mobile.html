<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Stock Adjustment Mobile</title>
<style>
html,body{margin:0;min-height:100%;background:#eef3f8;font-family:Arial,sans-serif}
.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.bb-loader-card{width:min(420px,100%);padding:20px;border:1px solid #d8e3ef;border-radius:14px;background:#fff;box-shadow:0 10px 32px rgba(23,63,119,.10);color:#173f77;font-weight:900;text-align:center}
.bb-loader-card span{display:block;margin-top:7px;color:#6d7f93;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="bb-loader"><div class="bb-loader-card">Loading Stock Adjustment…<span>Warehouse correction · Mobile workspace</span></div></div>
<script>
(async function(){
'use strict';

const MOBILE_STYLE=String.raw`
:root{--bb-navy:#173f77;--bb-blue:#245fae;--bb-line:#dce5ef;--bb-bg:#eef3f8;--bb-muted:#6d7f93;--bb-green:#16855c;--bb-red:#b43a3a;--bb-amber:#9a6800}
html,body{background:var(--bb-bg)!important;min-width:0!important;width:100%!important;overflow-x:hidden!important}
body.bb-adjust-mobile{min-width:0!important;padding:0 0 calc(78px + env(safe-area-inset-bottom))!important}
body.bb-adjust-mobile .page{width:min(760px,100%)!important;max-width:760px!important;margin:0 auto!important;padding:7px!important;box-sizing:border-box!important}
body.bb-adjust-mobile .topbar{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;align-items:start!important;margin:0 0 7px!important;padding:4px 2px!important}
body.bb-adjust-mobile .title{font-size:18px!important;line-height:1.1!important;letter-spacing:-.2px!important}
body.bb-adjust-mobile .subtitle{margin-top:3px!important;font-size:8px!important;line-height:1.35!important}
body.bb-adjust-mobile .top-actions{display:flex!important;gap:5px!important;align-items:center!important}
body.bb-adjust-mobile .last-update{display:none!important}
body.bb-adjust-mobile #refreshBtn{width:36px!important;min-width:36px!important;min-height:36px!important;padding:0!important;font-size:0!important;border-radius:9px!important}
body.bb-adjust-mobile #refreshBtn::after{content:'↻';font-size:18px!important}
body.bb-adjust-mobile .notice{margin:0 0 7px!important;padding:8px 9px!important;border-radius:9px!important;font-size:8px!important;line-height:1.35!important}
body.bb-adjust-mobile .status{margin:0 0 7px!important;padding:7px 9px!important;border-radius:9px!important;font-size:8px!important;line-height:1.35!important}
body.bb-adjust-mobile .layout{display:block!important}
body.bb-adjust-mobile main,body.bb-adjust-mobile aside{display:block!important;width:100%!important;min-width:0!important}
body.bb-adjust-mobile .card{margin:0 0 7px!important;padding:9px!important;border-radius:11px!important;box-shadow:none!important}
body.bb-adjust-mobile .section-title{margin:0 0 8px!important;font-size:12px!important;gap:6px!important}
body.bb-adjust-mobile .section-title small{font-size:7px!important;text-align:right!important}
body.bb-adjust-mobile .grid,body.bb-adjust-mobile .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important}
body.bb-adjust-mobile .field{min-width:0!important}
body.bb-adjust-mobile .field[style*="grid-column"]{grid-column:1/-1!important}
body.bb-adjust-mobile .field label{margin-bottom:3px!important;font-size:7px!important}
body.bb-adjust-mobile .field input,body.bb-adjust-mobile .field select,body.bb-adjust-mobile .field textarea{width:100%!important;min-width:0!important;min-height:36px!important;padding:6px 7px!important;border-radius:8px!important;font-size:10px!important;box-sizing:border-box!important}
body.bb-adjust-mobile .field textarea{min-height:58px!important}
body.bb-adjust-mobile .helper{font-size:7px!important}
body.bb-adjust-mobile .search-results{max-height:220px!important;border-radius:9px!important}
body.bb-adjust-mobile .result{padding:7px 8px!important}
body.bb-adjust-mobile .result strong{font-size:9px!important}
body.bb-adjust-mobile .result span{font-size:7px!important}
body.bb-adjust-mobile .product-preview{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:5px!important;margin-top:7px!important}
body.bb-adjust-mobile .preview-box{min-width:0!important;padding:7px!important;border-radius:8px!important}
body.bb-adjust-mobile .preview-box.product{grid-column:1/-1!important}
body.bb-adjust-mobile .preview-box small{font-size:6px!important}
body.bb-adjust-mobile .preview-box strong{margin-top:3px!important;font-size:11px!important}
body.bb-adjust-mobile .preview-box.product strong{font-size:10px!important}
body.bb-adjust-mobile .preview-box.product span{margin-top:2px!important;font-size:7px!important}
body.bb-adjust-mobile .add-row{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;align-items:end!important;margin-top:8px!important}
body.bb-adjust-mobile .add-row>.field:first-child{grid-column:1/-1!important}
body.bb-adjust-mobile .direction{gap:5px!important}
body.bb-adjust-mobile .direction button{min-height:36px!important;border-radius:8px!important;font-size:9px!important}
body.bb-adjust-mobile .after-box{min-height:36px!important;border-radius:8px!important;padding:6px 7px!important}
body.bb-adjust-mobile .after-box span{font-size:7px!important}
body.bb-adjust-mobile .after-box strong{font-size:10px!important}
body.bb-adjust-mobile #addBtn{grid-column:1/-1!important;width:100%!important;min-height:38px!important;padding:7px!important;border-radius:8px!important;font-size:9px!important}
body.bb-adjust-mobile .table-wrap{overflow:visible!important;border:0!important;border-radius:0!important}
body.bb-adjust-mobile .table-head{display:none!important}
body.bb-adjust-mobile #lines{display:block!important}
body.bb-adjust-mobile .line-row{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px!important;min-height:0!important;margin:0 0 6px!important;padding:7px!important;border:1px solid var(--bb-line)!important;border-radius:9px!important;background:#fbfcfe!important;font-size:8px!important}
body.bb-adjust-mobile .line-row:last-child{margin-bottom:0!important}
body.bb-adjust-mobile .line-row>div{min-width:0!important;text-align:center!important}
body.bb-adjust-mobile .line-product{grid-column:1/-1!important;text-align:left!important;padding-bottom:4px!important;border-bottom:1px solid #edf1f5!important}
body.bb-adjust-mobile .line-product strong{font-size:9px!important}
body.bb-adjust-mobile .line-product span{margin-top:2px!important;font-size:7px!important}
body.bb-adjust-mobile .line-row>div:nth-child(2)::before{content:'Before';display:block;color:#7b8da0;font-size:6px;margin-bottom:2px}
body.bb-adjust-mobile .line-row>div:nth-child(3)::before{content:'Type';display:block;color:#7b8da0;font-size:6px;margin-bottom:2px}
body.bb-adjust-mobile .line-row>div:nth-child(4)::before{content:'Qty';display:block;color:#7b8da0;font-size:6px;margin-bottom:2px}
body.bb-adjust-mobile .line-row>div:nth-child(5)::before{content:'After';display:block;color:#7b8da0;font-size:6px;margin-bottom:2px}
body.bb-adjust-mobile .line-row>div:nth-child(6)::before{content:'Avg Cost';display:block;color:#7b8da0;font-size:6px;margin-bottom:2px}
body.bb-adjust-mobile .line-row>div:nth-child(7)::before{content:'Value';display:block;color:#7b8da0;font-size:6px;margin-bottom:2px}
body.bb-adjust-mobile .line-row>div:nth-child(6),body.bb-adjust-mobile .line-row>div:nth-child(7){grid-column:span 2!important}
body.bb-adjust-mobile .line-row>div:nth-child(8){grid-column:1/-1!important}
body.bb-adjust-mobile .pill{padding:4px 6px!important;font-size:6px!important}
body.bb-adjust-mobile .remove{width:100%!important;min-height:28px!important;padding:4px 6px!important;font-size:7px!important}
body.bb-adjust-mobile .num{font-size:8px!important}
body.bb-adjust-mobile .empty{padding:16px 8px!important;font-size:9px!important}
body.bb-adjust-mobile .summary-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important;margin-top:7px!important}
body.bb-adjust-mobile .summary{min-width:0!important;padding:6px 4px!important;border-radius:8px!important;text-align:center!important}
body.bb-adjust-mobile .summary small{font-size:5.5px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
body.bb-adjust-mobile .summary strong{margin-top:3px!important;font-size:11px!important}
body.bb-adjust-mobile .success{margin-top:7px!important;padding:8px!important;border-radius:9px!important;font-size:9px!important}
body.bb-adjust-mobile .success span{font-size:7px!important}
body.bb-adjust-mobile .save-actions{position:fixed!important;z-index:1000;left:50%!important;bottom:0!important;transform:translateX(-50%)!important;width:min(760px,100%)!important;display:grid!important;grid-template-columns:.85fr 1.35fr!important;gap:6px!important;margin:0!important;padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))!important;border-top:1px solid #d8e3ef!important;background:rgba(255,255,255,.97)!important;box-shadow:0 -5px 18px rgba(23,63,119,.10)!important;backdrop-filter:blur(10px)!important}
body.bb-adjust-mobile .save-actions .btn{width:100%!important;min-height:41px!important;padding:7px!important;border-radius:8px!important;font-size:9px!important}
body.bb-adjust-mobile aside .card{padding:8px!important}
body.bb-adjust-mobile .recent{border-radius:8px!important}
body.bb-adjust-mobile .recent-row{grid-template-columns:82px minmax(0,1fr) 56px!important;gap:5px!important;padding:7px!important}
body.bb-adjust-mobile .recent-row strong{font-size:8px!important}
body.bb-adjust-mobile .recent-row span{font-size:6px!important}
body.bb-adjust-mobile .recent-row .net{font-size:9px!important}
body.bb-adjust-mobile .side-note{padding:8px!important;border-radius:8px!important;font-size:8px!important;line-height:1.4!important}
@media(max-width:380px){body.bb-adjust-mobile .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:340px){body.bb-adjust-mobile .page{padding:5px!important}body.bb-adjust-mobile .grid,body.bb-adjust-mobile .grid.two{gap:5px!important}body.bb-adjust-mobile .field input,body.bb-adjust-mobile .field select{font-size:9px!important}}
`;

const MOBILE_PATCH=String.raw`
(function(){
'use strict';
document.body.classList.add('bb-adjust-mobile');
const refresh=document.getElementById('refreshBtn');
if(refresh){refresh.title='Refresh Stock';refresh.setAttribute('aria-label','Refresh Stock')}
const title=document.querySelector('.title');if(title)title.textContent='⚖️ Stock Adjustment';
const subtitle=document.querySelector('.subtitle');if(subtitle)subtitle.textContent='Correct Warehouse physical stock with a permanent audit trail.';
const add=document.getElementById('addBtn');if(add)add.textContent='＋ Add to Adjustment';
const clear=document.getElementById('clearBtn');if(clear)clear.textContent='Clear Draft';
const save=document.getElementById('saveBtn');if(save)save.textContent='Save Adjustment';
})();
`;

try{
 const response=await fetch('adjustment.html?v=20260915-2',{cache:'no-store'});
 if(!response.ok)throw new Error('Could not load Stock Adjustment source.');
 let html=await response.text();
 const headClose=html.toLowerCase().indexOf('</head>');
 if(headClose<0)throw new Error('Stock Adjustment source is missing </head>.');
 html=html.slice(0,headClose)+'<style id="bbAdjustmentMobileStyle">'+MOBILE_STYLE+'</style>\n'+html.slice(headClose);
 const bodyClose=html.toLowerCase().lastIndexOf('</body>');
 if(bodyClose<0)throw new Error('Stock Adjustment source is missing </body>.');
 html=html.slice(0,bodyClose)+'<script>'+MOBILE_PATCH+'<\/script>\n'+html.slice(bodyClose);
 document.open();document.write(html);document.close();
}catch(error){
 document.body.innerHTML='<div class="bb-loader"><div class="bb-loader-card">Stock Adjustment could not load.<span>'+String(error?.message||error)+'</span></div></div>';
}
})();
</script>
</body>
</html>
